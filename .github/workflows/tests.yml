name: tests

on:
    push:
        branches: [main]
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        name: Lint and static analysis / PHP ${{ matrix.php }}
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
            - run: composer update --prefer-dist --no-interaction --no-progress
            - run: composer lint
            - run: composer analyse

    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                laravel: ['12.*', '13.*']
                stability: [prefer-lowest, prefer-stable]
                include:
                    - laravel: '12.*'
                      testbench: '10.*'
                    - laravel: '13.*'
                      testbench: '11.*'

        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}

        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring
                  coverage: none
            - run: php -v
            - run: |
                  composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" --no-interaction --no-update
                  composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                  composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress
            - run: vendor/bin/phpunit

    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring
                  coverage: pcov
            - run: composer update --prefer-dist --no-interaction --no-progress
            - run: vendor/bin/phpunit --coverage-text
